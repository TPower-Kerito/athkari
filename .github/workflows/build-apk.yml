name: Build Android APK & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK with Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android
          gradle assembleDebug --stacktrace --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk Athkari.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Athkari-APK
          path: Athkari.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "تطبيق أذكاري للأندرويد - الإصدار 1.0.0"
          body: |
            ### 🌿 تطبيق أذكاري للأندرويد (APK)
            
            - **طريقة التثبيت**: قم بتحميل ملف `Athkari.apk` وافتحه على هاتفك لتثبيته.
            - **العمل بدون إنترنت**: التطبيق يعمل بالكامل دون الحاجة لأي اتصال بالإنترنت.
            - **التحديث التلقائي**: بمجرد تعديل أي كود في المستودع، سيظهر لك إشعار داخل التطبيق للتحديث بضغطة زر واحدة دون الحاجة لإعادة تثبيت أي ملف APK مستقبلاً.
          files: Athkari.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
